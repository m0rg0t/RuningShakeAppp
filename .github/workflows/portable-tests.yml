name: Portable source regressions
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  portable-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.401'
      - name: Run source-linked synthetic regressions (no package sources)
        run: dotnet run --project tests/Portable.Tests/Portable.Tests.csproj --configuration Release
